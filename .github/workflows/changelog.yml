name: Update Changelog

on:
  push:
    branches:
      - main
      - beta
      - alpha

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine target directory
        id: target
        run: |
          # Single source directory for all branches (main/beta/alpha) — the
          # two-folder public_html vs public_html_beta split was consolidated.
          echo "dir=web/public_html" >> $GITHUB_OUTPUT

      - name: Check for relevant changes
        id: check
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- "${{ steps.target.outputs.dir }}/" 2>/dev/null | grep -v 'CHANGELOG.md' | grep -v 'README.md' || true)
          if [[ -z "$CHANGED" ]]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog entry
        if: steps.check.outputs.has_changes == 'true'
        run: |
          TARGET_DIR="${{ steps.target.outputs.dir }}"
          CHANGELOG="$TARGET_DIR/CHANGELOG.md"
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
          BRANCH="${{ github.ref_name }}"
          ACTOR="${{ github.actor }}"
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")

          # Get changed files in the target directory (exclude changelog/readme)
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- "$TARGET_DIR/" | grep -v 'CHANGELOG.md' | grep -v 'README.md' || true)

          # Build the new entry
          ENTRY="## [$SHORT_SHA] - $DATE\n\n"
          ENTRY+="**$COMMIT_MSG**\n\n"
          ENTRY+="- Commit: [\`$SHORT_SHA\`](https://github.com/${{ github.repository }}/commit/$COMMIT_SHA)\n\n"

          # Insert the new entry after the header lines in CHANGELOG.md
          if [[ -f "$CHANGELOG" ]]; then
            # Find the line number of the first "## " entry
            FIRST_ENTRY_LINE=$(grep -n "^## " "$CHANGELOG" | head -1 | cut -d: -f1)

            if [[ -n "$FIRST_ENTRY_LINE" ]]; then
              # Insert before the first existing entry
              {
                head -n $((FIRST_ENTRY_LINE - 1)) "$CHANGELOG"
                echo -e "$ENTRY"
                tail -n +$FIRST_ENTRY_LINE "$CHANGELOG"
              } > "${CHANGELOG}.tmp"
              mv "${CHANGELOG}.tmp" "$CHANGELOG"
            else
              # No existing entries — append after header
              echo -e "\n$ENTRY" >> "$CHANGELOG"
            fi
          else
            # Create new changelog
            {
              echo "# Changelog"
              echo ""
              echo "All notable changes to this project will be documented in this file."
              echo "This changelog is automatically maintained by GitHub Actions on each push."
              echo ""
              echo -e "$ENTRY"
            } > "$CHANGELOG"
          fi

      - name: Commit changelog
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.target.outputs.dir }}/CHANGELOG.md"

          # Check if there's actually something to commit
          if git diff --cached --quiet; then
            echo "No changelog changes to commit"
          else
            git commit -m "docs: auto-update changelog for ${{ steps.target.outputs.dir }} [skip ci]"

            # Pull any commits made by other workflows before pushing
            # Retry up to 3 times in case of race conditions
            for i in 1 2 3; do
              git fetch origin ${{ github.ref_name }}
              git rebase origin/${{ github.ref_name }} && git push origin ${{ github.ref_name }} && break
              echo "Push attempt $i failed, retrying..."
              sleep 2
            done
          fi

      - name: Determine remote path
        if: steps.check.outputs.has_changes == 'true' && vars.SFTP_ENABLED == 'true'
        id: remote
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "path=${{ secrets.SFTP_LIVE_PATH }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "beta" ]]; then
            echo "path=${{ secrets.SFTP_BETA_PATH }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "alpha" ]]; then
            echo "path=${{ secrets.SFTP_DEV_PATH }}" >> $GITHUB_OUTPUT
          fi

      - name: Check SFTP auth method
        if: steps.check.outputs.has_changes == 'true' && vars.SFTP_ENABLED == 'true'
        id: auth
        run: |
          if [[ -n "${{ secrets.SFTP_KEY }}" ]]; then
            echo "method=key" >> $GITHUB_OUTPUT
          else
            echo "method=password" >> $GITHUB_OUTPUT
          fi

      - name: Upload CHANGELOG.md via SFTP (SSH key)
        if: steps.check.outputs.has_changes == 'true' && vars.SFTP_ENABLED == 'true' && steps.auth.outputs.method == 'key'
        env:
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
          REMOTE_PATH: ${{ steps.remote.outputs.path }}
          CHANGELOG: ${{ steps.target.outputs.dir }}/CHANGELOG.md
        run: |
          sudo apt-get install -y lftp
          mkdir -p ~/.ssh
          echo "$SFTP_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          lftp -e "set sftp:connect-program \"ssh -o StrictHostKeyChecking=no -i $HOME/.ssh/deploy_key\"; open sftp://${SFTP_USER}@${SFTP_HOST}:${SFTP_PORT}; put ${CHANGELOG} -o ${REMOTE_PATH}/CHANGELOG.md; bye"

      - name: Upload CHANGELOG.md via SFTP (password)
        if: steps.check.outputs.has_changes == 'true' && vars.SFTP_ENABLED == 'true' && steps.auth.outputs.method == 'password'
        env:
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          REMOTE_PATH: ${{ steps.remote.outputs.path }}
          CHANGELOG: ${{ steps.target.outputs.dir }}/CHANGELOG.md
        run: |
          sudo apt-get install -y lftp
          lftp -u "${SFTP_USER},${SFTP_PASS}" -e "set sftp:auto-confirm yes; set ssl:verify-certificate no; put ${CHANGELOG} -o ${REMOTE_PATH}/CHANGELOG.md; bye" "sftp://${SFTP_HOST}:${SFTP_PORT}"

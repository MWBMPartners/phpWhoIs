name: Auto-increment version (semver)

on:
  push:
    branches:
      - beta
      - alpha
    paths:
      - 'web/public_html/**'
      - '!web/public_html/CHANGELOG.md'
      - '!web/public_html/README.md'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    # Skip if this commit was made by the bot (prevents infinite loops)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine semver bump type from commit message
        id: bump_type
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s%n%b")
          echo "Commit message:"
          echo "$COMMIT_MSG"

          # Check for breaking change (major bump)
          if echo "$COMMIT_MSG" | grep -qiE "^.*!:|BREAKING CHANGE"; then
            echo "type=major" >> $GITHUB_OUTPUT
            echo "Bump type: MAJOR"

          # Check for new feature (minor bump)
          elif echo "$COMMIT_MSG" | grep -qiE "^feat(\(.*\))?:"; then
            echo "type=minor" >> $GITHUB_OUTPUT
            echo "Bump type: MINOR"

          # Everything else: fix, chore, docs, style, refactor, etc. (patch bump)
          else
            echo "type=patch" >> $GITHUB_OUTPUT
            echo "Bump type: PATCH"
          fi

      - name: Bump version
        id: version
        run: |
          VERFILE="web/public_html/includes/infoAppVer.php"
          BUMP_TYPE="${{ steps.bump_type.outputs.type }}"

          # Extract current version
          CURRENT=$(grep -oP '\["Version"\]\["Number"\] = "\K[^"]+' "$VERFILE")
          echo "Current version: $CURRENT"

          # Split into major.minor.patch
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          # Apply semver bump
          case "$BUMP_TYPE" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: $NEW_VERSION ($BUMP_TYPE bump)"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

          # Update infoAppVer.php
          sed -i "s/\[\"Version\"\]\[\"Number\"\] = \"$CURRENT\"/[\"Version\"][\"Number\"] = \"$NEW_VERSION\"/" "$VERFILE"

          # Verify
          grep 'Version\"\]\[\"Number' "$VERFILE"

          # Update README.md version
          README="web/public_html/README.md"
          if [[ -f "$README" ]]; then
            sed -i "s/\*\*Version:\*\* .*/\*\*Version:\*\* ${NEW_VERSION}-beta/" "$README"
          fi

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public_html/includes/infoAppVer.php web/public_html/README.md

          if git diff --cached --quiet; then
            echo "No version changes to commit"
          else
            NEW_VERSION="${{ steps.version.outputs.new_version }}"
            BUMP_TYPE="${{ steps.bump_type.outputs.type }}"
            git commit -m "chore: bump version to ${NEW_VERSION} (${BUMP_TYPE}) [skip ci]"

            # Pull any commits made by other workflows (e.g. changelog) before pushing.
            # Branch is dynamic (beta or alpha) now that both trigger this workflow —
            # a hardcoded "beta" here would push an alpha-triggered bump onto beta.
            # Retry up to 3 times in case of race conditions
            for i in 1 2 3; do
              git fetch origin ${{ github.ref_name }}
              git rebase origin/${{ github.ref_name }} && git push origin ${{ github.ref_name }} && break
              echo "Push attempt $i failed, retrying..."
              sleep 2
            done
          fi

name: Update DNS Resolvers

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      min_reliability:
        description: 'Minimum reliability score (0.00–1.00)'
        required: false
        default: '0.80'
      max_per_country:
        description: 'Max auto-sourced resolvers per country'
        required: false
        default: '2'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    # Refresh the resolver list on every active development branch. Each branch
    # may lay its files out differently (public_html_beta vs public_html); the
    # updater script and the steps below are layout-invariant so the same job
    # works regardless of which directory a branch actually uses.
    strategy:
      fail-fast: false
      matrix:
        branch: [alpha, beta]

    env:
      DNS_MIN_RELIABILITY: ${{ github.event.inputs.min_reliability || '0.80' }}
      DNS_MAX_PER_COUNTRY: ${{ github.event.inputs.max_per_country || '2' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Run DNS resolver updater
        run: php scripts/update-dns-resolvers.php

      - name: Check for changes
        id: changes
        run: |
          # Match whichever resolver file(s) exist on this branch. Using a git
          # pathspec (quoted so the shell does not expand it) means the step
          # never references a path that is absent in the checked-out branch,
          # which is what used to make this job fail every day.
          if [ -n "$(git status --porcelain -- 'web/*/includes/dns_resolvers.php')" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "DNS resolvers updated on ${{ matrix.branch }}"
            git diff --stat -- 'web/*/includes/dns_resolvers.php'
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to DNS resolvers on ${{ matrix.branch }}"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- 'web/*/includes/dns_resolvers.php'
          git commit -m "chore: auto-update DNS resolver list from public-dns.info [skip ci]"

          pushed=false
          for i in 1 2 3; do
            git fetch origin "${{ matrix.branch }}"
            if git rebase "origin/${{ matrix.branch }}" && git push origin "HEAD:${{ matrix.branch }}"; then
              pushed=true
              break
            fi
            echo "Push attempt $i failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep "$((2 ** i))"
          done

          if [ "$pushed" != "true" ]; then
            echo "::error::Failed to push DNS resolver update to ${{ matrix.branch }} after 3 attempts"
            exit 1
          fi

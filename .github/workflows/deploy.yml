name: Deploy via SFTP

on:
  push:
    branches:
      - main
      - beta

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only run if SFTP credentials are configured
    if: ${{ vars.SFTP_ENABLED == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine deployment target
        id: target
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "remote_path=${{ secrets.SFTP_LIVE_PATH }}" >> $GITHUB_OUTPUT
            echo "source_dir=web/public_html/" >> $GITHUB_OUTPUT
            echo "channel=live" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "beta" ]]; then
            echo "remote_path=${{ secrets.SFTP_BETA_PATH }}" >> $GITHUB_OUTPUT
            echo "source_dir=web/public_html_beta/" >> $GITHUB_OUTPUT
            echo "channel=beta" >> $GITHUB_OUTPUT
          fi

      - name: Get changed files
        id: changes
        run: |
          SOURCE_DIR="${{ steps.target.outputs.source_dir }}"
          EXCLUDES="CHANGELOG.md|README.md|DEV_NOTES.md|\.DS_Store|\.gitkeep|\.gitignore"

          # Get files changed in this commit within the source directory
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- "$SOURCE_DIR" 2>/dev/null \
            | grep -vE "$EXCLUDES" || true)

          if [[ -z "$CHANGED" ]]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No deployable files changed in $SOURCE_DIR"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            # Store changed files (relative to source_dir) for upload
            FILE_LIST=""
            while IFS= read -r file; do
              # Strip source_dir prefix to get relative path
              REL_PATH="${file#$SOURCE_DIR}"
              FILE_LIST="${FILE_LIST}${REL_PATH}\n"
            done <<< "$CHANGED"
            echo -e "$FILE_LIST" > /tmp/changed_files.txt
            echo "Changed files to deploy:"
            cat /tmp/changed_files.txt
          fi

      - name: Set production dev status to NULL
        if: steps.changes.outputs.has_changes == 'true' && github.ref_name == 'main'
        run: |
          VERFILE="${{ steps.target.outputs.source_dir }}infoAppVer.php"
          if [[ -f "$VERFILE" ]]; then
            sed -i 's/\["Development"\]\["Status"\] = ".*"/["Development"]["Status"] = NULL/' "$VERFILE"
            echo "Set Development Status to NULL in $VERFILE"
          fi

      - name: Install lftp
        if: steps.changes.outputs.has_changes == 'true'
        run: sudo apt-get install -y lftp

      - name: Check auth method
        if: steps.changes.outputs.has_changes == 'true'
        id: auth
        run: |
          if [[ -n "${{ secrets.SFTP_KEY }}" ]]; then
            echo "method=key" >> $GITHUB_OUTPUT
          else
            echo "method=password" >> $GITHUB_OUTPUT
          fi

      - name: Build lftp upload script
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          SOURCE_DIR="${{ steps.target.outputs.source_dir }}"
          REMOTE_PATH="${{ steps.target.outputs.remote_path }}"

          # Build lftp commands to upload only changed files
          echo "# Auto-generated upload script" > /tmp/lftp_commands.txt
          while IFS= read -r rel_file; do
            [[ -z "$rel_file" ]] && continue
            LOCAL_FILE="${SOURCE_DIR}${rel_file}"
            if [[ -f "$LOCAL_FILE" ]]; then
              echo "put \"$LOCAL_FILE\" -o \"${REMOTE_PATH}${rel_file}\"" >> /tmp/lftp_commands.txt
              echo "  Upload: $rel_file"
            else
              echo "rm -f \"${REMOTE_PATH}${rel_file}\"" >> /tmp/lftp_commands.txt
              echo "  Delete: $rel_file (removed from repo)"
            fi
          done < /tmp/changed_files.txt
          echo "bye" >> /tmp/lftp_commands.txt

      - name: Deploy via SFTP (SSH key)
        if: steps.changes.outputs.has_changes == 'true' && steps.auth.outputs.method == 'key'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SFTP_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          lftp -e "set sftp:connect-program 'ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key'" \
            sftp://${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }}:${{ secrets.SFTP_PORT }} \
            < /tmp/lftp_commands.txt

      - name: Deploy via SFTP (password)
        if: steps.changes.outputs.has_changes == 'true' && steps.auth.outputs.method == 'password'
        run: |
          lftp -u "${{ secrets.SFTP_USER }},${{ secrets.SFTP_PASSWORD }}" \
            -e "set sftp:auto-confirm yes; set ssl:verify-certificate no" \
            sftp://${{ secrets.SFTP_HOST }}:${{ secrets.SFTP_PORT }} \
            < /tmp/lftp_commands.txt

      - name: Deployment summary
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          FILE_COUNT=$(grep -c "^put\|^rm" /tmp/lftp_commands.txt || echo "0")
          echo "### Deployed to ${{ steps.target.outputs.channel }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Files transferred:** $FILE_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- **Remote path:** ${{ steps.target.outputs.remote_path }}" >> $GITHUB_STEP_SUMMARY

      - name: Skip summary
        if: steps.changes.outputs.has_changes == 'false'
        run: |
          echo "### No deployment needed" >> $GITHUB_STEP_SUMMARY
          echo "No deployable files changed in ${{ steps.target.outputs.source_dir }}" >> $GITHUB_STEP_SUMMARY

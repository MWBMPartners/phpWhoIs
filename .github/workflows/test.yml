name: PHP Tests & Lint

on:
  push:
    branches:
      - main
      - release-candidate
      - beta
      - alpha
    paths:
      - 'web/**/*.php'
      - 'scripts/**'
      - 'tests/**'
      - 'composer.json'
      - 'phpunit.xml'
  pull_request:
    branches:
      - main
      - release-candidate
      - beta
      - alpha

jobs:
  lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Lint all PHP files
        run: |
          ERRORS=0
          for file in $(find web scripts -name "*.php" -type f); do
            php -l "$file" || ERRORS=$((ERRORS + 1))
          done
          if [ $ERRORS -gt 0 ]; then
            echo "::error::$ERRORS PHP file(s) have syntax errors"
            exit 1
          fi
          echo "All PHP files passed syntax check"

  test:
    name: PHPUnit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, json, mbstring, intl
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        run: vendor/bin/phpunit --testdox

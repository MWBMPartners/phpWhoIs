<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4dabf7"/>
      <stop offset="100%" style="stop-color:#1971c2"/>
    </linearGradient>
  </defs>
  <!-- Globe -->
  <circle cx="13" cy="13" r="10" fill="url(#fg)"/>
  <ellipse cx="13" cy="13" rx="5" ry="10" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.4"/>
  <line x1="3" y1="13" x2="23" y2="13" stroke="#fff" stroke-width="0.8" opacity="0.4"/>
  <!-- Magnifying glass ring -->
  <circle cx="13" cy="13" r="10" fill="none" stroke="#343a40" stroke-width="2.5"/>
  <!-- Handle -->
  <line x1="21" y1="21" x2="29" y2="29" stroke="#343a40" stroke-width="3.5" stroke-linecap="round"/>
</svg>

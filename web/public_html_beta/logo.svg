<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4dabf7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1971c2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#495057;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#343a40;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e7f5ff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#a5d8ff;stop-opacity:0.1" />
    </linearGradient>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.6; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      .lens-shine { animation: pulse 3s ease-in-out infinite; }
      .globe-group { animation: float 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Globe (domain/internet) -->
  <g class="globe-group">
    <!-- Globe circle -->
    <circle cx="200" cy="200" r="140" fill="url(#globeGrad)" opacity="0.9"/>

    <!-- Globe grid lines - meridians -->
    <ellipse cx="200" cy="200" rx="140" ry="140" fill="none" stroke="#fff" stroke-width="2" opacity="0.3"/>
    <ellipse cx="200" cy="200" rx="70" ry="140" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.25"/>
    <ellipse cx="200" cy="200" rx="35" ry="140" fill="none" stroke="#fff" stroke-width="1" opacity="0.2"/>

    <!-- Globe grid lines - parallels -->
    <ellipse cx="200" cy="200" rx="140" ry="50" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.25"/>
    <ellipse cx="200" cy="200" rx="140" ry="100" fill="none" stroke="#fff" stroke-width="1" opacity="0.2"/>
    <line x1="60" y1="200" x2="340" y2="200" stroke="#fff" stroke-width="1.5" opacity="0.25"/>

    <!-- Domain text on globe -->
    <!--<text x="200" y="190" text-anchor="middle" fill="#fff" font-family="'Segoe UI', system-ui, sans-serif" font-size="32" font-weight="700" opacity="0.9">.COM</text>-->
    <text x="200" y="225" text-anchor="middle" fill="#fff" font-family="'Segoe UI', system-ui, sans-serif" font-size="64" font-weight="400" opacity="0.8">WHOIS</text>
  </g>

  <!-- Magnifying glass ring -->
  <circle cx="230" cy="230" r="155" fill="none" stroke="#dee2e6" stroke-width="18" opacity="0.15"/>
  <circle cx="230" cy="230" r="155" fill="none" stroke="url(#handleGrad)" stroke-width="14"/>

  <!-- Lens shine -->
  <circle cx="230" cy="230" r="148" fill="url(#lensGrad)" class="lens-shine"/>

  <!-- Magnifying glass handle -->
  <line x1="345" y1="345" x2="460" y2="460" stroke="url(#handleGrad)" stroke-width="36" stroke-linecap="round"/>
  <line x1="345" y1="345" x2="460" y2="460" stroke="#6c757d" stroke-width="28" stroke-linecap="round"/>

  <!-- Handle highlight -->
  <line x1="350" y1="340" x2="445" y2="445" stroke="#adb5bd" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
</svg>

openapi: 3.0.3
info:
  title: DomainCheckr API (mwWhoIs)
  description: |
    Comprehensive domain intelligence API providing WHOIS/RDAP lookups, DNS records,
    SSL/TLS certificates, email security, security assessments, and much more.

    ## Authentication
    - **Web (default):** Requires a CSRF token from the session (`csrf_token` POST field).
    - **JSON API (`?format=json`):** No CSRF required. CORS enabled.
    - **API Key:** Send `X-API-Key` header for authenticated access with configurable rate limits.

    ## Rate Limiting
    - **Default:** 30 requests per 60-second window per session and per IP address.
    - **API Key users:** Configurable per-key limits (up to 300+/min for premium tiers).
    - **Headers:** `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `X-RateLimit-Reset` included on responses
      that pass authentication and rate-limiting (not on 4xx errors — the rate-limit headers are set after
      the 401/403/429 early-exits in `lookup.php`). There is no `Retry-After` header.
    - Exceeding the limit returns HTTP 429.

    ## Caching
    - Results are cached for **15 minutes** (900 seconds).
    - Cached responses include `"cached": true`.

    ## Do Not Track (DNT)
    - When `DNT: 1` header is sent, third-party lookups (geolocation, screenshots, Safe Browsing, VirusTotal, HIBP, AbuseIPDB, Shodan, PhishTank, cert transparency, reverse IP, tech stack, robots.txt) are skipped.
    - Response includes `"dnt": true` and server sends `Tk: N`.

    ## Security
    - Content Security Policy (CSP) on all pages
    - Swagger UI self-hosted (no third-party CDN for API-docs assets); Bootstrap served from jsdelivr CDN
    - WHOIS contact masking available for GDPR compliance
  version: "1.49.0" # Keep in sync with includes/infoAppVer.php (not auto-bumped)
  contact:
    name: MWBM Partners Ltd
  license:
    name: Proprietary

servers:
  - url: /
    description: Current server

paths:
  /lookup:
    post:
      operationId: domainLookup
      summary: Perform a comprehensive domain or IP lookup
      description: |
        Returns WHOIS/RDAP data, DNS records, SSL/TLS info, email security (SPF/DMARC/DKIM/MTA-STS/BIMI),
        DNSSEC status, security assessments (Safe Browsing, VirusTotal, PhishTank, URLhaus, Spamhaus, AbuseIPDB),
        HTTP security headers audit, TLS version audit, technology stack detection, and much more.
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json]
        - name: source
          in: query
          schema:
            type: string
            enum: [rdap, whois]
            default: rdap
        - name: suggest
          in: query
          description: |
            Switches the endpoint into on-demand domain-suggestions mode. When `suggest=1`, the request
            body's `domain` field is checked across popular alternative TLDs instead of performing a full
            lookup, and the response is a `SuggestResponse` instead of a `LookupResponse`. Still rate-limited
            like the main lookup. An invalid/unparseable domain returns `{"suggestions": [], "grid": null}`
            with HTTP 200 rather than an error.
          schema:
            type: string
            enum: ["1"]
        - name: X-API-Key
          in: header
          description: Optional API key for authenticated access with higher rate limits.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [domain]
              properties:
                domain:
                  type: string
                  description: Domain name or IP address to look up.
                  maxLength: 253
                csrf_token:
                  type: string
                  description: CSRF token. Required unless using ?format=json or X-API-Key.
                source:
                  type: string
                  enum: [rdap, whois]
                dns_propagation_only:
                  type: string
                  description: |
                    When set to a truthy value, skips the full lookup pipeline and returns only a
                    lightweight `PropagationRefreshResponse` (`{"dns_propagation": {...}}`) — used by the
                    UI to refresh the DNS propagation panel without re-running the whole lookup.
      responses:
        "200":
          description: Successful lookup
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: Maximum requests per window.
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: Requests remaining in current window.
            X-RateLimit-Reset:
              schema:
                type: integer
              description: Unix timestamp when the rate limit resets.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LookupResponse"
                  - $ref: "#/components/schemas/SuggestResponse"
                  - $ref: "#/components/schemas/PropagationRefreshResponse"
                description: |
                  `LookupResponse` for a normal lookup, `SuggestResponse` when `?suggest=1` was used, or
                  `PropagationRefreshResponse` when `dns_propagation_only` was set in the request body.
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: CSRF validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Method not allowed (POST only). Empty body.
          headers:
            Allow:
              schema:
                type: string
                enum: [POST]
              description: Always "POST".
        "413":
          description: Request body exceeds 1,024 bytes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /health:
    get:
      operationId: healthCheck
      summary: Health check endpoint
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /feed:
    get:
      operationId: changelogFeed
      summary: RSS feed of application changelog entries
      description: |
        Parses `CHANGELOG.md` into an RSS 2.0 feed of recent application changes (not domain/watchlist
        changes — see `/feed-watchlist` for that). Limited to the most recent 20 entries.
      responses:
        "200":
          description: RSS 2.0 feed of changelog entries
          content:
            application/xml:
              schema:
                type: string

  /feed-watchlist:
    get:
      operationId: watchlistFeed
      summary: RSS feed of WHOIS changes for watched domains
      description: |
        Returns an RSS 2.0 feed built from the watched-domains change log written by `monitor.php`
        (falls back to last-checked status items when no change log exists yet). Access is currently
        gated client-side only, via the browser's `watchedDomains` localStorage.
      responses:
        "200":
          description: RSS 2.0 feed of watched-domain changes
          content:
            application/rss+xml:
              schema:
                type: string

components:
  schemas:
    LookupResponse:
      type: object
      properties:
        domain:
          type: string
        is_ip:
          type: boolean
        availability:
          type: string
          enum: [registered, available, unknown, "n/a"]
        data_source:
          type: string
          enum: [rdap, whois]
        whois:
          type: string
          description: WHOIS text (HTML-escaped in default mode).
        raw:
          type: string
          description: Raw WHOIS text (JSON mode only).
        cached:
          type: boolean
        dnt:
          type: boolean
        parsed:
          type: object
          description: Parsed WHOIS fields (Domain Name, Registrar, dates, Name Servers, etc.)
        dns:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [A, AAAA, MX, NS, TXT, CNAME]
              value:
                type: string
              priority:
                type: integer
        reverse_dns:
          type: string
          nullable: true
          description: PTR hostname (IP lookups only).
        email_security:
          type: object
          description: SPF, DMARC, DKIM check results.
          properties:
            spf:
              type: object
              properties:
                found: { type: boolean }
                record: { type: string, nullable: true }
                status: { type: string }
            dmarc:
              type: object
              properties:
                found: { type: boolean }
                record: { type: string, nullable: true }
                status: { type: string }
            dkim:
              type: object
              properties:
                found: { type: boolean }
                selector: { type: string }
                status: { type: string }
        ssl:
          type: object
          nullable: true
          description: SSL/TLS certificate information.
        geolocation:
          type: object
          nullable: true
          description: IP geolocation (country, city, ISP, AS).
        subdomains:
          type: array
          items:
            type: object
            properties:
              subdomain: { type: string }
              ip: { type: string }
        registrar_reputation:
          type: object
          nullable: true
        safe_browsing:
          type: object
          nullable: true
          description: Google Safe Browsing check (requires API key).
        virustotal:
          type: object
          nullable: true
          description: VirusTotal domain reputation (requires API key).
        screenshot_url:
          type: string
          nullable: true
        hibp:
          type: array
          nullable: true
          description: Have I Been Pwned breach data (requires API key).
        dnssec:
          type: object
          nullable: true
          properties:
            signed: { type: boolean }
            ds_records: { type: integer }
            status: { type: string }
        cert_transparency:
          type: object
          nullable: true
          description: Certificate Transparency log from crt.sh.
          properties:
            total: { type: integer }
            recent:
              type: array
              items:
                type: object
        domain_age_risk:
          type: object
          nullable: true
          properties:
            risk: { type: string, enum: [low, low-medium, medium, high] }
            days_old: { type: integer }
            reason: { type: string }
        abuseipdb:
          type: object
          nullable: true
          description: AbuseIPDB reputation (requires API key).
        shodan:
          type: object
          nullable: true
          description: Shodan exposed services (requires API key).
        phishtank:
          type: object
          nullable: true
          description: PhishTank phishing check (requires API key).
        urlhaus:
          type: object
          nullable: true
          description: URLhaus malware URL check (free, no key).
        spamhaus:
          type: object
          nullable: true
          description: Spamhaus DNSBL check.
        multi_dnsbl:
          type: object
          nullable: true
          description: Multi-DNSBL check (8 blocklists).
          properties:
            ip: { type: string }
            listed: { type: boolean }
            total_checked: { type: integer }
            lists:
              type: array
              items:
                type: object
                properties:
                  zone: { type: string }
                  label: { type: string }
        mta_sts:
          type: object
          nullable: true
          properties:
            found: { type: boolean }
            record: { type: string, nullable: true }
            mode: { type: string, nullable: true }
        bimi:
          type: object
          nullable: true
          properties:
            found: { type: boolean }
            record: { type: string, nullable: true }
            logo_url: { type: string, nullable: true }
        dane_tlsa:
          type: object
          nullable: true
          properties:
            found: { type: boolean }
            records: { type: array }
        whois_privacy:
          type: object
          nullable: true
          properties:
            privacy_enabled: { type: boolean }
            indicators: { type: array, items: { type: string } }
        hosting_risk:
          type: object
          nullable: true
          properties:
            risk: { type: string, enum: [low, medium, high] }
            country: { type: string }
            country_code: { type: string }
            reason: { type: string }
        http_headers:
          type: object
          nullable: true
          description: HTTP security headers audit with A-F grade.
          properties:
            grade: { type: string }
            pass: { type: integer }
            total: { type: integer }
            headers:
              type: array
              items:
                type: object
                properties:
                  header: { type: string }
                  description: { type: string }
                  present: { type: boolean }
                  value: { type: string, nullable: true }
        redirect_chain:
          type: object
          nullable: true
          description: HTTP redirect chain analysis.
          properties:
            chain:
              type: array
              items:
                type: object
                properties:
                  url: { type: string }
                  status: { type: integer }
            hops: { type: integer }
            http_to_https: { type: boolean }
            suspicious: { type: boolean }
        tls_audit:
          type: object
          nullable: true
          description: TLS version and cipher suite audit.
          properties:
            versions:
              type: object
              description: Map of TLS version to support boolean.
            cipher: { type: string, nullable: true }
            protocol: { type: string, nullable: true }
            insecure: { type: boolean }
        caa_records:
          type: object
          nullable: true
          properties:
            found: { type: boolean }
            records:
              type: array
              items:
                type: object
                properties:
                  flag: { type: integer }
                  tag: { type: string }
                  value: { type: string }
        smtp_security:
          type: object
          nullable: true
          properties:
            mx_host: { type: string }
            banner: { type: string, nullable: true }
            starttls: { type: boolean }
            reachable: { type: boolean }
        reverse_ip:
          type: object
          nullable: true
          description: Reverse IP lookup (shared hosting).
          properties:
            ip: { type: string }
            count: { type: integer }
            domains: { type: array, items: { type: string } }
        http_versions:
          type: object
          nullable: true
          properties:
            http2: { type: boolean }
            http3: { type: boolean }
            protocol: { type: string, nullable: true }
        ipv6:
          type: object
          nullable: true
          properties:
            has_aaaa: { type: boolean }
            aaaa_records: { type: array, items: { type: string } }
        response_times:
          type: object
          nullable: true
          properties:
            dns_ms: { type: integer, nullable: true }
            ttfb_ms: { type: integer, nullable: true }
            total_ms: { type: integer, nullable: true }
        ns_diversity:
          type: object
          nullable: true
          properties:
            nameservers: { type: array }
            unique_networks: { type: integer }
            diverse: { type: boolean }
            warning: { type: string, nullable: true }
        domain_suggestions:
          type: array
          items:
            type: string
          description: >-
            Always empty; use POST /lookup?suggest=1 (retained for backward compatibility).
        tech_stack:
          type: array
          nullable: true
          items:
            type: object
            properties:
              category: { type: string }
              name: { type: string }
        robots_txt:
          type: object
          nullable: true
          properties:
            robots_found: { type: boolean }
            sitemap_found: { type: boolean }
            disallowed: { type: array, items: { type: string } }
            sitemaps: { type: array, items: { type: string } }
            crawl_delay: { type: integer, nullable: true }
        dns_propagation:
          allOf:
            - $ref: "#/components/schemas/DnsPropagation"
          nullable: true
        security_score:
          type: object
          nullable: true
          description: Aggregated security score (A-F grade, 12 checks).
          properties:
            grade: { type: string }
            score: { type: integer }
            passed: { type: integer }
            total: { type: integer }
        verification_token:
          type: string
          nullable: true
          description: DNS TXT verification token for domain ownership proof.
        rate_limit:
          type: object
          properties:
            used: { type: integer }
            remaining: { type: integer }
            limit: { type: integer }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    DnsPropagation:
      type: object
      properties:
        resolvers:
          type: array
          items:
            type: object
            properties:
              resolver: { type: string }
              ip: { type: string }
              answers: { type: array, items: { type: string } }
        consistent: { type: boolean }

    SuggestResponse:
      type: object
      description: |
        Response body for POST /lookup?suggest=1 (on-demand domain-suggestions mode).
      required: [suggestions, grid]
      properties:
        suggestions:
          type: array
          items:
            type: string
          description: Available alternative domains (subset of grid.results where availability=available).
        grid:
          type: object
          nullable: true
          description: Null when the submitted domain is invalid/unparseable.
          properties:
            label:
              type: string
              description: The domain label (SLD) checked across alternative TLDs.
            current_tld:
              type: string
              description: The TLD of the originally submitted domain (excluded from results).
            results:
              type: array
              items:
                type: object
                properties:
                  domain:
                    type: string
                  tld:
                    type: string
                  availability:
                    type: string
                    enum: [available, registered, unknown]
                  cached:
                    type: boolean

    PropagationRefreshResponse:
      type: object
      description: |
        Response body for POST /lookup with a truthy dns_propagation_only field — a lightweight refresh
        that returns only the DNS propagation panel data.
      required: [dns_propagation]
      properties:
        dns_propagation:
          $ref: "#/components/schemas/DnsPropagation"

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, warning, error]
        version:
          type: string
        dev_status:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          description: Dependency/diagnostic checks, keyed by check name.
          properties:
            php:
              type: object
              properties:
                status: { type: string, enum: [ok, warning, error] }
                version: { type: string }
            curl:
              type: object
              properties:
                status: { type: string, enum: [ok, warning] }
                detail: { type: string }
            whois:
              type: object
              properties:
                status: { type: string, enum: [ok, error] }
                detail: { type: string }
            sessions:
              type: object
              properties:
                status: { type: string, enum: [ok, error] }
                detail: { type: string }
            cache:
              type: object
              properties:
                status: { type: string, enum: [ok, warning] }
                detail: { type: string }
                cached_entries: { type: integer }
            tld_data:
              type: object
              properties:
                status: { type: string, enum: [ok, warning] }
                tlds_file: { type: string }
                suffixes_file: { type: string }
            error_log:
              type: object
              properties:
                status: { type: string, enum: [ok] }
                path: { type: string }
                exists: { type: boolean }

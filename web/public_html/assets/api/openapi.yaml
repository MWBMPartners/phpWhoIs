openapi: 3.0.3
info:
  title: mwWhoIs API
  description: |
    Comprehensive domain intelligence API providing WHOIS/RDAP lookups, DNS records,
    SSL/TLS certificates, email security, security assessments, and much more.

    ## Authentication (Issue #198)
    The lookup API is **not anonymous**. Every `POST /lookup` request (in any of its
    three modes — main lookup, on-demand TLD suggestions, or DNS-propagation refresh)
    must carry one of:
    - **`X-API-Key` header** — a valid, provisioned API key. Intended for programmatic /
      server-to-server callers. Grants JSON responses regardless of `?format=json` and
      may carry a higher per-key rate limit (see below).
    - **`csrf_token` form field** — a valid CSRF token tied to the caller's session
      (`$_SESSION['csrf_token']`). This is the same-origin browser path used by the
      mwWhoIs web UI; it is issued to the page on load and is not obtainable by
      third-party/cross-origin callers.

    A request with neither returns `403 Invalid request`. There is **no wildcard CORS**
    and no anonymous `?format=json` bypass — both were removed as part of #198, which
    had previously let an anonymous, cross-origin `POST /lookup?format=json` run the
    entire outbound lookup pipeline (WHOIS/RDAP fetch + ~35-check enrichment pipeline)
    with no auth at all.

    ## Rate Limiting
    - **Default:** 30 requests per 60-second window, enforced independently per
      session AND per IP address (both must pass).
    - **API Key users:** configurable per-key limits (up to 300+/min for premium tiers),
      applied to both the session and IP checks in place of the default.
    - **Headers:** `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `X-RateLimit-Reset`
      included on every successful response.
    - Exceeding the limit returns HTTP `429` with a `Retry-After` header (seconds until
      the current window resets) in addition to the `X-RateLimit-*` headers.

    ## Caching
    - Full lookup responses (the entire enrichment pipeline, not just the raw WHOIS
      text) are cached for **15 minutes** (900 seconds), keyed by domain, DNT state,
      and response shape.
    - Cached responses include `"cached": true`. `source=whois` requests always bypass
      this cache so the WHOIS-diff feature keeps seeing a fresh fetch.

    ## Do Not Track (DNT)
    - When a `DNT: 1` header is sent, all third-party/outbound enrichment calls are
      skipped: geolocation, screenshots, Safe Browsing, VirusTotal, HIBP, AbuseIPDB,
      Shodan, PhishTank, certificate transparency (crt.sh), reverse IP, technology-stack
      detection, robots.txt/sitemap analysis, HTTP security-header audit, redirect-chain
      detection, TLS version audit, and HTTP/2//3 + response-time measurement.
    - Checks that don't call a third party (DNSSEC, MTA-STS, BIMI, DANE/TLSA, CAA,
      SMTP security, IPv6 readiness, NS diversity, DNS propagation, multi-DNSBL/
      Spamhaus, WHOIS-privacy detection, subdomain discovery, domain-age risk) still run.
    - Response includes `"dnt": true` and the server sends `Tk: N` (vs. `Tk: ?` when
      DNT was not requested).

    ## Enrichment is skipped for available domains
    When `availability` resolves to `available` (the name is unregistered), the entire
    enrichment pipeline is skipped and every enrichment field is returned at its
    default value (`null` for single objects, `[]` for lists) — the frontend hides
    those panes for unregistered names anyway, so there's no lookup cost paid for them.

    ## Progressive module loading (Issue #196)
    `POST /lookup` also supports fetching a lookup in smaller pieces instead of the
    single monolithic `LookupResponse`, via the `modules` query parameter:

    1. `POST /lookup?modules=core` — the blocking WHOIS/RDAP + DNS slice
       (`CoreLookupResponse`), typically under 3 seconds. Returns a `lookup_token`
       and a `modules_available` list telling the caller which module groups are
       worth fetching next: `[]` for an unregistered (`available`) domain,
       `["email", "reputation"]` for an IP-address lookup, or all five module keys
       otherwise.
    2. `POST /lookup?modules=<dns|web|email|reputation|subdomains>` — one
       enrichment module group (`ModuleResponse`), fetchable independently and
       concurrently once `modules_available` says it applies.
    3. `POST /lookup?modules=score` — the aggregated security score
       (`ScoreResponse`), computed server-side from whichever module group
       responses are already cached; fetch it after the module group(s) feeding
       the score have resolved.

    Every progressive-module request uses the **same auth rule** as the default
    lookup (`X-API-Key` header or `csrf_token` form field — see Authentication
    above) and the same base rate limiting. Additionally, present the
    `lookup_token` issued by a `modules=core` (or the legacy default) response as
    the `lookup_token` form field on a subsequent module request — `core`, `dns`,
    `web`, `email`, `reputation`, `subdomains`, or `score` — for the *same domain*
    to exempt that request from rate-limit counting. The token is an HMAC bound to
    the caller's session (or API key) and the domain, and expires ~180 seconds
    after issuance. A missing, expired, tampered, or mismatched token never causes
    an error — the request simply falls back to normal counted rate limiting.

    `modules` cannot be combined with `suggest` or `dns_propagation_only` (`400`).
    An unrecognised `modules` value also returns `400`. The default (no `modules`
    param) response shape — `LookupResponse` — is unchanged and remains the
    default/full response.

    ## Security
    - Content Security Policy (CSP) on all pages
    - Subresource Integrity (SRI) on CDN assets
    - WHOIS contact masking available for GDPR compliance
  version: "1.50.0"
  contact:
    name: MWBM Partners Ltd
  license:
    name: Proprietary

servers:
  - url: /
    description: Current server

paths:
  /lookup:
    post:
      operationId: domainLookup
      summary: Domain/IP lookup, progressive lookup modules, on-demand TLD
        suggestions, or DNS-propagation refresh
      description: |
        A single endpoint with four request modes, selected by query string / body
        fields:

        1. **Main lookup** (default) — `domain` in the form body. Returns WHOIS/RDAP
           data, DNS records, SSL/TLS info, email security (SPF/DMARC/DKIM/MTA-STS/BIMI),
           DNSSEC status, security assessments (Safe Browsing, VirusTotal, PhishTank,
           URLhaus, Spamhaus, AbuseIPDB), HTTP security-header audit, TLS version audit,
           technology-stack detection, and much more — see `LookupResponse`.
        2. **Progressive lookup modules** (`?modules=core|dns|web|email|reputation|
           subdomains|score`, Issue #196) — body `domain` (+ optional
           `lookup_token`, + `source` for `modules=core` only). Fetches one slice of
           the main lookup at a time instead of the full `LookupResponse` — see
           "Progressive module loading" in the top-level description above for the
           full contract, and `CoreLookupResponse` / `ModuleResponse` /
           `ScoreResponse` for the response shapes. Cannot be combined with
           `suggest`/`dns_propagation_only` (`400`).
        3. **On-demand TLD suggestions** (`?suggest=1` query param, Issue #164) — body
           `domain` only. Runs the alternative-TLD availability grid (parallel RDAP
           checks against ~25 popular TLDs) and returns `SuggestResponse`. This replaced
           the old behaviour of computing suggestions automatically on every main
           lookup; `domain_suggestions` in `LookupResponse` is now always `[]`.
        4. **DNS-propagation-only refresh** (`dns_propagation_only=1` form field) —
           body `domain`, optional `full=1` to check every enabled resolver instead of
           the curated ~25-resolver panel. Skips the entire lookup/enrichment pipeline
           and returns only `DnsPropagationOnlyResponse`. Used by the frontend to poll
           propagation status without re-running the full lookup.

        All four modes share the same auth (`X-API-Key` or `csrf_token`) and base
        rate limiting; progressive module requests can additionally exempt
        themselves from rate-limit counting with a `lookup_token` (see above).
      security:
        - ApiKeyAuth: []
        - {}
      parameters:
        - name: format
          in: query
          description: Request a JSON response (main-lookup mode only; ignored by the
            other two modes, which always return JSON). Implied automatically when a
            valid `X-API-Key` is supplied.
          schema:
            type: string
            enum: [json]
        - name: source
          in: query
          description: Preferred data source for the main lookup. `whois` also bypasses
            the full-response cache so a fresh copy is always fetched. Also honored by
            `?modules=core` requests (Issue #196); ignored for other `modules` values.
          schema:
            type: string
            enum: [rdap, whois]
            default: rdap
        - name: suggest
          in: query
          description: Set to `1` to switch this request into on-demand TLD-suggestion
            mode (see description above). Any other value is ignored.
          schema:
            type: string
            enum: ["1"]
        - name: modules
          in: query
          description: |
            Switch this request into progressive-module mode (Issue #196; see
            "Progressive module loading" in the top-level description above). Omit
            for the full legacy `LookupResponse` (default). `core` returns the
            blocking WHOIS/RDAP + DNS slice; `score` returns the aggregated security
            score; the remaining values each return one enrichment module group.
            Cannot be combined with `suggest` or `dns_propagation_only` (`400`); an
            unrecognised value also returns `400`.
          schema:
            type: string
            enum: [core, dns, web, email, reputation, subdomains, score]
        - name: X-API-Key
          in: header
          description: API key for authenticated/programmatic access. Alternative to
            the `csrf_token` form field; see the Authentication section above.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: "#/components/schemas/LookupRequestBody"
                - $ref: "#/components/schemas/DnsPropagationOnlyRequestBody"
            examples:
              mainLookup:
                summary: Main lookup
                value: { domain: "example.com", source: "rdap" }
              coreModule:
                summary: Progressive module — modules=core (use with ?modules=core)
                value: { domain: "example.com", csrf_token: "…", source: "rdap" }
              moduleFetch:
                summary: Progressive module — modules=dns|web|email|reputation|
                  subdomains|score (use with the matching ?modules= value), presenting
                  the lookup_token from a prior modules=core response
                value: { domain: "example.com", csrf_token: "…", lookup_token: "…" }
              suggest:
                summary: On-demand TLD suggestions (use with ?suggest=1)
                value: { domain: "example.com" }
              dnsPropagationOnly:
                summary: DNS-propagation-only refresh
                value: { domain: "example.com", dns_propagation_only: "1", full: "0" }
      responses:
        "200":
          description: |
            Successful response. Shape depends on the request mode: `LookupResponse`
            for the main lookup (no `modules` param — the default), `CoreLookupResponse`
            for `?modules=core`, `ModuleResponse` for `?modules=dns|web|email|
            reputation|subdomains`, `ScoreResponse` for `?modules=score`,
            `SuggestResponse` for `?suggest=1`, or `DnsPropagationOnlyResponse` for
            `dns_propagation_only=1`.

            Note: progressive-module responses (`CoreLookupResponse`/
            `ModuleResponse`/`ScoreResponse`) do NOT carry the `X-RateLimit-*`
            response headers below — those are only set on the legacy/default
            `LookupResponse` path. `CoreLookupResponse` carries an equivalent
            `rate_limit` body field instead; `ModuleResponse`/`ScoreResponse` carry
            no rate-limit signal at all (their exemption/counting already happened
            by the time they're built).
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: Maximum requests per window for this caller (session/IP
                default, or the API key's configured tier).
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: Requests remaining in the current window.
            X-RateLimit-Reset:
              schema:
                type: integer
              description: Unix timestamp when the rate limit window resets.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LookupResponse"
                  - $ref: "#/components/schemas/CoreLookupResponse"
                  - $ref: "#/components/schemas/ModuleResponse"
                  - $ref: "#/components/schemas/ScoreResponse"
                  - $ref: "#/components/schemas/SuggestResponse"
                  - $ref: "#/components/schemas/DnsPropagationOnlyResponse"
              examples:
                coreLookup:
                  summary: modules=core response
                  value:
                    domain: example.com
                    is_ip: false
                    availability: registered
                    data_source: rdap
                    parsed: {}
                    dns: []
                    whois: "Domain Name: EXAMPLE.COM..."
                    cached: false
                    registrar_reputation: null
                    domain_age_risk: null
                    whois_privacy: null
                    screenshot_url: null
                    domain_suggestions: []
                    verification_token: "mwwhois-verify-abc123"
                    lookup_token: "eyJ2IjoxLCJkIjoiZXhhbXBsZS5jb20ifQ.c2lnbmF0dXJl"
                    modules_available: [dns, web, email, reputation, subdomains]
                    rate_limit:
                      used: 1
                      remaining: 29
                      limit: 30
                    dnt: false
                moduleFetch:
                  summary: modules=dns response
                  value:
                    domain: example.com
                    module: dns
                    status: ok
                    dnt: false
                    cached: false
                    generated_at: 1752300000
                    data:
                      dnssec:
                        signed: true
                        ds_records: 1
                        status: signed
                      ipv6:
                        has_aaaa: true
                        aaaa_records: ["2606:2800:220:1:248:1893:25c8:1946"]
                      ns_diversity:
                        nameservers: [ns1.example.com, ns2.example.com]
                        unique_networks: 2
                        diverse: true
                        warning: null
                      dns_propagation:
                        resolvers: []
                        consistent: true
                    skipped: {}
                scoreFetch:
                  summary: modules=score response
                  value:
                    domain: example.com
                    module: score
                    status: ok
                    dnt: false
                    cached: false
                    generated_at: 1752300030
                    data:
                      security_score:
                        grade: B
                        score: 83
                        passed: 10
                        total: 12
                        details: []
                      inputs_missing: []
                    skipped: {}
        "400":
          description: |
            Invalid input (e.g. malformed domain name). Also returned when
            `modules` is an unrecognised value, or when `modules` is combined with
            `suggest` or `dns_propagation_only`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing/invalid CSRF token and no valid API key was supplied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Method not allowed (POST only)
        "413":
          description: Request body exceeds 1,024 bytes
        "429":
          description: Rate limit exceeded (session or IP window, or API key tier)
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying — the time remaining in the
                current rate-limit window.
            X-RateLimit-Limit:
              schema:
                type: integer
            X-RateLimit-Remaining:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /health:
    get:
      operationId: healthCheck
      summary: Health check endpoint
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /feed:
    get:
      operationId: rssFeed
      summary: RSS feed of watched domain changes
      responses:
        "200":
          description: RSS 2.0 feed
          content:
            application/rss+xml:
              schema:
                type: string

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Programmatic/server-to-server access. When absent, the request must instead
        carry a valid `csrf_token` form field tied to the caller's session (the
        same-origin web UI path) — see the Authentication section in the top-level
        `description`. OpenAPI's security-scheme model can't express that OR directly,
        so this operation is marked as not strictly requiring `ApiKeyAuth` even though
        the server requires ONE of the two.

  schemas:
    LookupRequestBody:
      type: object
      required: [domain]
      properties:
        domain:
          type: string
          description: Domain name or IP address to look up.
          maxLength: 253
        csrf_token:
          type: string
          description: CSRF token from the caller's session. Required unless a valid
            `X-API-Key` header is supplied.
        source:
          type: string
          enum: [rdap, whois]
          description: Overrides the `source` query parameter when both are present.
        lookup_token:
          type: string
          description: |
            Optional. Only meaningful on `?modules=` requests (Issue #196; any
            module value, including `core`) — presents a token previously issued
            in a `lookup_token` response field (by a `modules=core` request, or by
            the legacy default response) to exempt THIS request from rate-limit
            counting. Bound to the calling session/API key and to the `domain`
            above; expires ~180 seconds after issuance. Has no effect when
            `modules` is absent; any validation failure (missing, expired,
            tampered, wrong domain/caller) silently falls back to normal counted
            rate limiting rather than an error.

    DnsPropagationOnlyRequestBody:
      type: object
      required: [domain, dns_propagation_only]
      properties:
        domain:
          type: string
          description: Domain name to check propagation for.
          maxLength: 253
        csrf_token:
          type: string
          description: CSRF token from the caller's session. Required unless a valid
            `X-API-Key` header is supplied.
        dns_propagation_only:
          type: string
          enum: ["1"]
          description: Switches this request into DNS-propagation-only mode.
        full:
          type: string
          enum: ["1", "0"]
          description: When `1`, checks every enabled DNS resolver instead of the
            curated ~25-resolver default panel.

    DnsResolverResult:
      type: object
      properties:
        id:
          type: string
          description: Resolver identifier (config key or array index).
        resolver:
          type: string
          description: Human-readable resolver name (e.g. "Google Public DNS").
        ip:
          type: string
        country_code:
          type: string
        location:
          type: string
        type:
          type: string
          description: Resolver category (e.g. "standard", "doh").
        answers:
          type: array
          items:
            type: string
          description: A-record IPs returned by this resolver (empty if it didn't
            answer within the time cap).

    DnsPropagation:
      type: object
      nullable: true
      description: DNS-propagation check across multiple public resolvers.
      properties:
        resolvers:
          type: array
          items:
            $ref: "#/components/schemas/DnsResolverResult"
        consistent:
          type: boolean
          description: True if every responding resolver returned the same answer set.

    SuggestResponse:
      type: object
      properties:
        suggestions:
          type: array
          items:
            type: string
          description: Alternative-TLD domains found to be available (subset of
            `grid.results` where `availability == "available"`). Empty array if the
            input domain was invalid.
        grid:
          type: object
          nullable: true
          description: Full alternative-TLD availability grid. `null` when the input
            domain couldn't be split into a label + TLD.
          properties:
            label:
              type: string
              description: The registrable domain's left-hand label (SLD).
            current_tld:
              type: string
              description: The TLD of the domain that was looked up (excluded from
                `results`).
            results:
              type: array
              items:
                type: object
                properties:
                  domain:
                    type: string
                  tld:
                    type: string
                  availability:
                    type: string
                    enum: [registered, available, unknown]
                  cached:
                    type: boolean

    DnsPropagationOnlyResponse:
      type: object
      properties:
        dns_propagation:
          $ref: "#/components/schemas/DnsPropagation"

    ParsedWhoisFields:
      type: object
      description: |
        Fields extracted from the raw WHOIS/RDAP text by regex. Availability of any
        given key depends entirely on what the registry's WHOIS output includes, so
        treat every property as optional; registries may also return additional
        fields not listed here.
      properties:
        Domain Name:
          type: string
        Registrar:
          type: string
        Creation Date:
          type: string
        Expiry Date:
          type: string
        Updated Date:
          type: string
        Registrant Org:
          type: string
        Registrant Country:
          type: string
        Status:
          type: array
          items:
            type: string
        Name Servers:
          type: array
          items:
            type: string
        Domain Age:
          type: string
          description: Human-readable age computed from Creation Date (e.g. "3 years, 2 months").
        Expires In:
          type: string
          description: Human-readable countdown computed from Expiry Date (e.g. "45 days").
        PTR Hostname:
          type: string
          description: Reverse-DNS hostname (IP lookups only).
      additionalProperties: true

    SslInfo:
      type: object
      nullable: true
      description: SSL/TLS certificate information for the domain's HTTPS endpoint.
        `null` if the TLS handshake failed or the host doesn't serve HTTPS.
      properties:
        subject:
          type: string
        issuer:
          type: string
        valid_from:
          type: string
          description: "Format: Y-m-d H:i:s"
        valid_to:
          type: string
          description: "Format: Y-m-d H:i:s"
        serial:
          type: string
        expires_in:
          type: string
          description: e.g. "45 days"
        expired:
          type: boolean
        san:
          type: array
          items:
            type: string
          description: Subject Alternative Names, if the certificate has any.

    SecurityScoreDetail:
      type: object
      properties:
        name:
          type: string
          description: e.g. "HTTPS / SSL", "HSTS", "DNSSEC", "SPF", "DMARC", "DKIM",
            "MTA-STS", "TLS Version", "Blocklist", "CAA Records", "Malware / Phishing".
        status:
          type: string
          enum: [pass, warn, fail]
        info:
          type: string
        recommendation:
          type: string
          nullable: true
        guide:
          type: string
          nullable: true
          description: URL to further reading, present only when `recommendation` is set.

    SecurityScore:
      type: object
      nullable: true
      description: Aggregated security score across 12 checks.
      properties:
        grade:
          type: string
          enum: [A, B, C, D, E, F]
        score:
          type: integer
          description: Percentage of checks passed (0-100).
        passed:
          type: integer
        total:
          type: integer
        details:
          type: array
          items:
            $ref: "#/components/schemas/SecurityScoreDetail"

    LookupResponse:
      type: object
      description: |
        Response for the main lookup mode. Every enrichment field below is `null`
        (or `[]` for list-typed fields) when `availability` is `available` — see the
        "Enrichment is skipped for available domains" note in the top-level
        description. A field is also `null`/absent-of-data when the corresponding
        third-party API key isn't configured, or when `dnt` is `true` and the field
        depends on a third-party/outbound call (noted per-field below).
      properties:
        domain:
          type: string
        is_ip:
          type: boolean
          description: True if the input was an IP address rather than a domain name.
        availability:
          type: string
          enum: [registered, available, unknown, "n/a"]
          description: '"n/a" for IP-address lookups (availability doesn''t apply to IPs).'
        data_source:
          type: string
          enum: [rdap, whois]
        parsed:
          $ref: "#/components/schemas/ParsedWhoisFields"
        dns:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [A, AAAA, MX, NS, TXT, CNAME]
              value:
                type: string
              priority:
                type: integer
                description: MX priority (MX records only).
        raw:
          type: string
          nullable: true
          description: Raw WHOIS/RDAP-derived text. Present when the request resolved
            to JSON mode (`?format=json` or a valid `X-API-Key`); mutually exclusive
            with `whois` below.
        whois:
          type: string
          nullable: true
          description: WHOIS text, HTML-escaped (and optionally contact-masked for
            GDPR). Present when the request used the default (non-JSON, session/CSRF
            web-UI) mode; mutually exclusive with `raw` above.
        reverse_dns:
          type: string
          description: PTR hostname. Only present at all for IP-address lookups (key
            is omitted entirely for domain lookups).
        cached:
          type: boolean
          description: True if the full response (not just the raw WHOIS text) was
            served from the 15-minute cache.
        dnt:
          type: boolean
          description: 'Echoes whether the request sent `DNT: 1`.'
        email_security:
          type: object
          description: SPF, DMARC, DKIM check results. `{}` when enrichment was skipped.
          properties:
            spf:
              type: object
              properties:
                found: { type: boolean }
                record: { type: string, nullable: true }
                status: { type: string }
            dmarc:
              type: object
              properties:
                found: { type: boolean }
                record: { type: string, nullable: true }
                status: { type: string }
            dkim:
              type: object
              properties:
                found: { type: boolean }
                selector: { type: string }
                status: { type: string }
        ssl:
          $ref: "#/components/schemas/SslInfo"
        geolocation:
          type: object
          nullable: true
          description: IP geolocation (country, region, city, ISP, AS) for the domain's
            first A record, or the IP itself for IP lookups. Skipped when `dnt` is true.
          properties:
            country: { type: string }
            country_code: { type: string }
            region: { type: string }
            city: { type: string }
            isp: { type: string }
            org: { type: string }
            as: { type: string }
        subdomains:
          type: array
          items:
            type: object
            properties:
              subdomain: { type: string }
              ip: { type: string, nullable: true }
        registrar_reputation:
          type: object
          nullable: true
          description: Registrar reputation lookup, based on the parsed WHOIS
            "Registrar" field.
        safe_browsing:
          type: object
          nullable: true
          description: Google Safe Browsing check. `null` if no
            `safe_browsing_api_key` is configured, the request is an IP lookup, or
            `dnt` is true.
        virustotal:
          type: object
          nullable: true
          description: VirusTotal domain reputation. `null` if no `virustotal_api_key`
            is configured, the request is an IP lookup, or `dnt` is true.
        screenshot_url:
          type: string
          nullable: true
          description: Generated thumb.io screenshot URL. `null` if screenshots aren't
            enabled in config, the request is an IP lookup, or `dnt` is true.
        hibp:
          type: array
          nullable: true
          description: Have I Been Pwned breach data. `null` if no `hibp_api_key` is
            configured, the request is an IP lookup, or `dnt` is true.
        dnssec:
          type: object
          nullable: true
          properties:
            signed: { type: boolean }
            ds_records: { type: integer }
            status: { type: string }
        cert_transparency:
          type: object
          nullable: true
          description: Certificate Transparency log summary from crt.sh. `null` for
            IP lookups or when `dnt` is true.
          properties:
            total: { type: integer }
            recent:
              type: array
              items:
                type: object
        domain_age_risk:
          type: object
          nullable: true
          properties:
            risk: { type: string, enum: [low, low-medium, medium, high] }
            days_old: { type: integer }
            reason: { type: string }
        abuseipdb:
          type: object
          nullable: true
          description: AbuseIPDB reputation for the resolved IP. `null` if no
            `abuseipdb_api_key` is configured, no IP could be resolved, or `dnt` is true.
        shodan:
          type: object
          nullable: true
          description: Shodan exposed-services summary for the resolved IP. `null` if
            no `shodan_api_key` is configured, no IP could be resolved, or `dnt` is true.
        phishtank:
          type: object
          nullable: true
          description: PhishTank phishing check. `null` if no `phishtank_api_key` is
            configured, the request is an IP lookup, or `dnt` is true.
        urlhaus:
          type: object
          nullable: true
          description: URLhaus malware-URL check (free, no key). `null` for IP lookups
            or when `dnt` is true.
        spamhaus:
          type: object
          nullable: true
          description: Derived from the Spamhaus ZEN entry in `multi_dnsbl` (a single
            shared DNSBL query, not a separate lookup).
          properties:
            listed: { type: boolean }
            lists:
              type: array
              items:
                type: object
                properties:
                  zone: { type: string }
                  label: { type: string }
        multi_dnsbl:
          type: object
          nullable: true
          description: Multi-DNSBL check (6 blocklists) against the resolved IP.
          properties:
            ip: { type: string }
            listed: { type: boolean }
            total_checked: { type: integer }
            lists:
              type: array
              items:
                type: object
                properties:
                  zone: { type: string }
                  label: { type: string }
        mta_sts:
          type: object
          nullable: true
          properties:
            found: { type: boolean }
            record: { type: string, nullable: true }
            mode: { type: string, nullable: true }
        bimi:
          type: object
          nullable: true
          properties:
            found: { type: boolean }
            record: { type: string, nullable: true }
            logo_url: { type: string, nullable: true }
        dane_tlsa:
          type: object
          nullable: true
          properties:
            found: { type: boolean }
            records: { type: array, items: { type: object } }
        whois_privacy:
          type: object
          nullable: true
          properties:
            privacy_enabled: { type: boolean }
            indicators: { type: array, items: { type: string } }
        hosting_risk:
          type: object
          nullable: true
          description: Computed from `geolocation`, so also affected by `dnt`
            (geolocation is skipped when DNT is on).
          properties:
            risk: { type: string, enum: [low, medium, high] }
            country: { type: string }
            country_code: { type: string }
            reason: { type: string }
        http_headers:
          type: object
          nullable: true
          description: HTTP security-headers audit with A-F grade. `null` for IP
            lookups or when `dnt` is true.
          properties:
            grade: { type: string }
            pass: { type: integer }
            total: { type: integer }
            headers:
              type: array
              items:
                type: object
                properties:
                  header: { type: string }
                  description: { type: string }
                  present: { type: boolean }
                  value: { type: string, nullable: true }
        redirect_chain:
          type: object
          nullable: true
          description: HTTP redirect-chain analysis. `null` for IP lookups or when
            `dnt` is true.
          properties:
            chain:
              type: array
              items:
                type: object
                properties:
                  url: { type: string }
                  status: { type: integer }
            hops: { type: integer }
            http_to_https: { type: boolean }
            suspicious: { type: boolean }
        tls_audit:
          type: object
          nullable: true
          description: TLS version and cipher-suite audit. `null` for IP lookups or
            when `dnt` is true.
          properties:
            versions:
              type: object
              description: Map of TLS version to support boolean.
            cipher: { type: string, nullable: true }
            protocol: { type: string, nullable: true }
            insecure:
              type: boolean
              description: True if TLS 1.0/1.1 is accepted.
        caa_records:
          type: object
          nullable: true
          properties:
            found: { type: boolean }
            records:
              type: array
              items:
                type: object
                properties:
                  flag: { type: integer }
                  tag: { type: string }
                  value: { type: string }
        smtp_security:
          type: object
          nullable: true
          properties:
            mx_host: { type: string }
            banner: { type: string, nullable: true }
            starttls: { type: boolean }
            reachable: { type: boolean }
        reverse_ip:
          type: object
          nullable: true
          description: Reverse-IP lookup (shared hosting detection). `null` when `dnt`
            is true or no A record was found.
          properties:
            ip: { type: string }
            count: { type: integer }
            domains: { type: array, items: { type: string } }
        http_versions:
          type: object
          nullable: true
          description: HTTP/2 and HTTP/3 support. `null` for IP lookups or when `dnt`
            is true.
          properties:
            http2: { type: boolean }
            http3: { type: boolean }
            protocol: { type: string, nullable: true }
        ipv6:
          type: object
          nullable: true
          properties:
            has_aaaa: { type: boolean }
            aaaa_records: { type: array, items: { type: string } }
        response_times:
          type: object
          nullable: true
          description: DNS/TTFB/total response-time measurements. `null` for IP
            lookups or when `dnt` is true.
          properties:
            dns_ms: { type: integer, nullable: true }
            ttfb_ms: { type: integer, nullable: true }
            total_ms: { type: integer, nullable: true }
        ns_diversity:
          type: object
          nullable: true
          properties:
            nameservers: { type: array, items: { type: string } }
            unique_networks: { type: integer }
            diverse: { type: boolean }
            warning: { type: string, nullable: true }
        domain_suggestions:
          type: array
          items:
            type: string
          description: |
            Deprecated / always `[]`. Automatic suggestions were removed for
            performance (Issue #116/#164); use `POST /lookup?suggest=1` instead.
        tech_stack:
          type: array
          nullable: true
          description: Detected technologies (CMS, JS framework, CDN, etc). `null`
            for IP lookups or when `dnt` is true.
          items:
            type: object
            properties:
              category: { type: string }
              name: { type: string }
        robots_txt:
          type: object
          nullable: true
          description: robots.txt / sitemap analysis. `null` for IP lookups or when
            `dnt` is true.
          properties:
            robots_found: { type: boolean }
            sitemap_found: { type: boolean }
            disallowed: { type: array, items: { type: string } }
            sitemaps: { type: array, items: { type: string } }
            crawl_delay: { type: integer, nullable: true }
        dns_propagation:
          $ref: "#/components/schemas/DnsPropagation"
        security_score:
          $ref: "#/components/schemas/SecurityScore"
        verification_token:
          type: string
          nullable: true
          description: DNS TXT verification token for domain-ownership proof. `null`
            for IP lookups or if no session is available.
        lookup_token:
          type: string
          nullable: true
          description: |
            HMAC-signed token, valid ~180 seconds, issued fresh on every response
            (Issue #196). Can be presented as the `lookup_token` form field on
            subsequent `?modules=` requests for this SAME domain to exempt them
            from rate-limit counting — see "Progressive module loading" in the
            top-level description. `null` if no session is available. Excluded
            from the 15-minute full-response cache (re-minted on every request,
            including cache hits), unlike the rest of this response.
        rate_limit:
          type: object
          description: Mirrors the `X-RateLimit-*` response headers in the JSON body.
          properties:
            used: { type: integer }
            remaining: { type: integer }
            limit: { type: integer }

    CoreLookupResponse:
      type: object
      description: |
        Response for `POST /lookup?modules=core` (Issue #196) — the blocking
        WHOIS/RDAP + DNS slice of the lookup pipeline (typically under 3 seconds),
        MINUS the ~30 third-party enrichment fields `LookupResponse` carries
        (`email_security`, `ssl`, `geolocation`, `security_score`, etc. — those
        live in `ModuleResponse`/`ScoreResponse` instead), PLUS `lookup_token` and
        `modules_available`. Same `whois`/`raw` mutual-exclusivity rule as
        `LookupResponse` (session/CSRF web-UI callers get escaped+masked `whois`;
        `?format=json`/API-key callers get `raw`).
      properties:
        domain:
          type: string
        is_ip:
          type: boolean
        availability:
          type: string
          enum: [registered, available, unknown, "n/a"]
        data_source:
          type: string
          enum: [rdap, whois]
        parsed:
          $ref: "#/components/schemas/ParsedWhoisFields"
        dns:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [A, AAAA, MX, NS, TXT, CNAME]
              value:
                type: string
              priority:
                type: integer
                description: MX priority (MX records only).
        raw:
          type: string
          nullable: true
          description: Raw WHOIS/RDAP-derived text. Present when the request
            resolved to JSON mode (`?format=json` or a valid `X-API-Key`);
            mutually exclusive with `whois` below.
        whois:
          type: string
          nullable: true
          description: WHOIS text, HTML-escaped (and optionally contact-masked for
            GDPR). Present when the request used the default (non-JSON,
            session/CSRF web-UI) mode; mutually exclusive with `raw` above.
        reverse_dns:
          type: string
          description: PTR hostname. Only present at all for IP-address lookups
            (key is omitted entirely for domain lookups).
        cached:
          type: boolean
          description: True if the raw WHOIS text came from the per-domain WHOIS
            cache. Unlike `LookupResponse.cached`, this is NOT the 15-minute
            full-response cache — `modules=core` always re-derives availability/
            parsed/dns fresh from that raw text on every request.
        registrar_reputation:
          type: object
          nullable: true
          description: Registrar reputation lookup, based on the parsed WHOIS
            "Registrar" field.
        domain_age_risk:
          type: object
          nullable: true
          properties:
            risk: { type: string, enum: [low, low-medium, medium, high] }
            days_old: { type: integer }
            reason: { type: string }
        whois_privacy:
          type: object
          nullable: true
          properties:
            privacy_enabled: { type: boolean }
            indicators: { type: array, items: { type: string } }
        screenshot_url:
          type: string
          nullable: true
          description: Generated thumb.io screenshot URL. `null` if screenshots
            aren't enabled in config, the request is an IP lookup, or `dnt` is true.
        domain_suggestions:
          type: array
          items:
            type: string
          description: Always `[]` — see `LookupResponse.domain_suggestions`.
        verification_token:
          type: string
          nullable: true
          description: DNS TXT verification token for domain-ownership proof.
            `null` for IP lookups or if no session is available.
        lookup_token:
          type: string
          description: |
            HMAC-signed token (`base64url(payload).base64url(signature)`), valid
            for ~180 seconds from issuance. Present it as the `lookup_token` form
            field on follow-up `?modules=` requests (`dns`/`web`/`email`/
            `reputation`/`subdomains`/`score`, or another `core`) for this SAME
            domain to exempt those requests from rate-limit counting. Bound to the
            caller's session (or API key) — a token minted for one caller cannot
            be replayed by another.
        modules_available:
          type: array
          items:
            type: string
            enum: [dns, web, email, reputation, subdomains]
          description: |
            Which module groups are worth fetching next. `[]` when `availability`
            is `available` (nothing to enrich for an unregistered name — mirrors
            `LookupResponse`'s "enrichment is skipped for available domains"
            rule). `["email", "reputation"]` for an IP-address lookup (the only
            groups with any IP-applicable checks). All five module keys
            otherwise. Never includes `score` — fetch `?modules=score` once you
            have whichever of the listed groups you need reflected in it.
        rate_limit:
          type: object
          properties:
            used: { type: integer }
            remaining: { type: integer }
            limit: { type: integer }
        dnt:
          type: boolean
      required: [domain, is_ip, availability, lookup_token, modules_available, dnt]

    ModuleResponse:
      type: object
      description: |
        Response for `POST /lookup?modules=<dns|web|email|reputation|subdomains>`
        (Issue #196) — one enrichment module group's data, decomposed out of the
        equivalent keys in `LookupResponse`:
        - `dns`: `dnssec`, `ipv6`, `ns_diversity`, `dns_propagation`. Not
          DNT-gated; cached without a `:dnt` cache-key suffix (its checks never
          call a third party).
        - `web`: `ssl`, `http_headers`, `tls_audit`, `http_versions`,
          `redirect_chain`, `response_times`, `tech_stack`, `robots_txt`,
          `cert_transparency`, `dane_tlsa`, `caa_records`.
        - `email`: `email_security`, `mta_sts`, `bimi`, `smtp_security`, `hibp`,
          `multi_dnsbl`, `spamhaus` (derived from `multi_dnsbl`'s Spamhaus ZEN
          entry, not a separate lookup).
        - `reputation`: `safe_browsing`, `virustotal`, `phishtank`, `urlhaus`,
          `abuseipdb`, `shodan`, `geolocation`, `hosting_risk` (derived from
          `geolocation`, computed unconditionally even when `geolocation` is
          null/DNT-skipped).
        - `subdomains`: `subdomains`, `reverse_ip`.

        Every key's shape matches the identically-named property on
        `LookupResponse`. `status` is `skipped_available` (with empty `data`/
        `skipped`) when the domain's availability — read from a prior
        `modules=core` call's cache, or a fresh raw-WHOIS lookup if no core cache
        exists yet — is `available`; enrichment never runs for unregistered names.
      properties:
        domain:
          type: string
        module:
          type: string
          enum: [dns, web, email, reputation, subdomains]
        status:
          type: string
          enum: [ok, skipped_available]
        dnt:
          type: boolean
        cached:
          type: boolean
          description: True when this module's response came from its own
            15-minute per-module cache (`mod:{module}:{domain}[:dnt]`) rather than
            running the checks fresh on this request.
        generated_at:
          type: integer
          description: Unix timestamp of when this response was produced.
        data:
          type: object
          additionalProperties: true
          description: Map of check-key → result, for whichever checks in this
            module ran (see the per-module key lists above). A key is absent from
            `data` (and present in `skipped` instead) if it didn't run.
        skipped:
          type: object
          additionalProperties:
            type: string
            enum: [dnt, is_ip, no_api_key, no_a_record, no_multi_dnsbl]
          description: Map of check-key → reason it did not run — `dnt` (skipped
            under Do-Not-Track), `is_ip` (check doesn't apply to bare IP lookups),
            `no_api_key` (the check's required third-party API key isn't
            configured), `no_a_record` (no resolvable A record for an
            IP-dependent check), or `no_multi_dnsbl` (`spamhaus` couldn't be
            derived because `multi_dnsbl` itself didn't run).
      required: [domain, module, status, dnt, cached, generated_at, data, skipped]

    ScoreResponse:
      type: object
      description: |
        Response for `POST /lookup?modules=score` (Issue #196). Computed
        server-side from whichever of the `dns`/`web`/`email`/`reputation` module
        caches already exist for this domain — fetch it after the module
        group(s) feeding the score have resolved for a complete picture; the
        score is still computed (just from fewer inputs, listed in
        `inputs_missing`) if some module caches are missing. Never cached
        itself — `cached` is always `false`.
      properties:
        domain:
          type: string
        module:
          type: string
          enum: [score]
        status:
          type: string
          enum: [ok]
        dnt:
          type: boolean
        cached:
          type: boolean
          enum: [false]
        generated_at:
          type: integer
        data:
          type: object
          properties:
            security_score:
              allOf:
                - $ref: "#/components/schemas/SecurityScore"
              description: Null for IP-address lookups only (a security score
                has no meaning for a bare IP) — otherwise always computed, even
                when every input in `inputs_missing` is missing (those checks are
                then scored as failing/absent).
            inputs_missing:
              type: array
              items:
                type: string
                enum: [dns, web, email, reputation]
              description: Module groups whose cache wasn't found when this score
                was computed. Fetch that module's `?modules=` endpoint and
                re-fetch `?modules=score` for a more complete score.
        skipped:
          type: object
          description: Always `{}` — present only for envelope-shape consistency
            with `ModuleResponse`; scoring has no per-check skip reasons of its own.
      required: [domain, module, status, dnt, cached, generated_at, data, skipped]

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, warning, error]
        version:
          type: string
        dev_status:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
